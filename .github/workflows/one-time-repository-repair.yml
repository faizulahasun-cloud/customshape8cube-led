name: One-time repository repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI and dependencies
        uses: arduino/setup-arduino-cli@v2
      - name: Install Uno core and AltSoftSerial
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install AltSoftSerial

      - name: Compile firmware before repair
        run: |
          rm -rf /tmp/cube-sketch
          mkdir -p /tmp/cube-sketch
          cp LED_Cube_SMODE_512BIT_3BYTE_FIXED.ino /tmp/cube-sketch/cube-sketch.ino
          arduino-cli compile --fqbn arduino:avr:uno /tmp/cube-sketch

      - name: Apply confirmed repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          ino_path=Path('LED_Cube_SMODE_512BIT_3BYTE_FIXED.ino')
          html_path=Path('index.html')
          readme_path=Path('README.md')
          log_path=Path('CODE_CHANGE_LOG.md')
          ino=ino_path.read_text(encoding='utf-8')
          html=html_path.read_text(encoding='utf-8')
          readme=readme_path.read_text(encoding='utf-8')
          log=log_path.read_text(encoding='utf-8')
          ino_before='char rxBuffer[512];\nbyte rxLength=0;'
          ino_after='char rxBuffer[512];\nunsigned int rxLength=0;'
          assert ino.count(ino_before)==1
          ino=ino.replace(ino_before,ino_after,1)
          html_before='else if(cleanData==="CUSTOM_NOT_READY"){customReady=false;document.getElementById("runCustomBtn").disabled=true;log.innerText="CUSTOM FUNCTION NOT READY";log.className="status-panel status-disconnected";}'
          html_after='else if(cleanData==="CUSTOM_NOT_READY"){customReady=false;webCubeMode="NONE";document.getElementById("runCustomBtn").disabled=true;document.getElementById("stopCustomBtn").disabled=true;log.innerText="CUSTOM FUNCTION NOT READY";log.className="status-panel status-disconnected";}'
          assert html.count(html_before)==1
          html=html.replace(html_before,html_after,1)
          replacements=[
          ('- **Custom Shapes**: Send 3D Heart and Cross patterns to the LED cube','- **Custom Functions**: Upload user-defined 3D voxel functions to the LED cube'),
          ('- **Next Pattern Step** - Progress to next pattern','- **Next Animation** - Advance to the next built-in animation in Manual Mode'),
          ('- **Custom Shapes** - Send Heart or Cross 3D patterns','- **Custom Functions** - Enter and upload a supported custom voxel function'),
          ('- ✅ Chrome/Chromium (Windows, macOS, Linux, Android)\n- ✅ Edge (Windows, macOS)\n- ✅ Safari (macOS, iOS)\n- ✅ Opera','- ✅ Chrome/Chromium (Windows, macOS, Linux, Android)\n- ✅ Edge (Windows, macOS, Android)\n- ✅ Opera (desktop and supported Android versions)\n- ❌ Safari/iOS Safari: native Web Bluetooth is not supported')]
          for before,after in replacements:
              assert readme.count(before)==1
              readme=readme.replace(before,after,1)
          log += f'''\n\n### 2026-09-07 — Fix Custom receive-length overflow\n\n- File: `LED_Cube_SMODE_512BIT_3BYTE_FIXED.ino`\n- Change type: `FIX`\n- Before: `{ino_before}`\n- After: `{ino_after}`\n- Reason: `rxBuffer` is 512 bytes but `rxLength` was an 8-bit `byte`, wrapping at 255 bytes. Larger Custom uploads could therefore corrupt the receive buffer instead of using the existing 511-byte bounds check. The counter is widened to `unsigned int`.\n- Contract/regression checks performed: Preserved the Custom `C`/`CF_END` protocol, compile/start separation, all built-in animations, display refresh, touch, brightness, BLE behavior, and pin assignments.\n\n### 2026-09-07 — Fix Custom error-state UI synchronization\n\n- File: `index.html`\n- Change type: `FIX`\n- Before: `{html_before}`\n- After: `{html_after}`\n- Reason: `CUSTOM_NOT_READY` previously disabled Start Custom but could leave the browser's local Custom mode and Stop button stale. The UI now returns to `NONE` and disables Stop Custom when Arduino reports that no valid Custom program exists.\n- Contract/regression checks performed: No command format changed; ACKs remain status-only; `X` remains the Arduino start request; BLE write queue, 20-byte upload slicing, 3.5-second connection delay, and Auto/Manual/Next behavior preserved.\n\n### 2026-09-07 — Refresh README for current Custom-only Web Bluetooth implementation\n\n- File: `README.md`\n- Change type: `DOCUMENTATION`\n- Reason: The README still described removed Heart/Cross-only Custom behavior and claimed Safari/iOS support that is not provided by native Web Bluetooth. The current page instead uses a general Custom Function editor, and native Safari/iOS Web Bluetooth remains unsupported.\n'''
          ino_path.write_text(ino,encoding='utf-8')
          html_path.write_text(html,encoding='utf-8')
          readme_path.write_text(readme,encoding='utf-8')
          log_path.write_text(log.rstrip()+'\n',encoding='utf-8')
          PY

      - name: Syntax check web JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S)
          assert len(scripts)==1
          Path('/tmp/app.js').write_text(scripts[0],encoding='utf-8')
          PY
          node --check /tmp/app.js

      - name: Compile repaired firmware
        run: |
          rm -rf /tmp/cube-sketch
          mkdir -p /tmp/cube-sketch
          cp LED_Cube_SMODE_512BIT_3BYTE_FIXED.ino /tmp/cube-sketch/cube-sketch.ino
          arduino-cli compile --fqbn arduino:avr:uno /tmp/cube-sketch

      - name: Commit repairs and remove temporary workflow
        run: |
          git rm .github/workflows/one-time-repository-repair.yml
          git add LED_Cube_SMODE_512BIT_3BYTE_FIXED.ino index.html README.md CODE_CHANGE_LOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Repair confirmed firmware and web UI defects"
          git push origin HEAD:main
