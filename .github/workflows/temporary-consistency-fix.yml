name: Temporary Consistency Fix

on:
  push:
    branches: [temp-consistency-fix]

permissions:
  contents: write

jobs:
  apply:
    if: startsWith(github.event.head_commit.message, 'TEMP: apply requested consistency fixes')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch firmware, contract, and change log
        shell: python
        run: |
          from pathlib import Path
          from datetime import datetime

          ino = Path('LED_Cube_SMODE_512BIT_3BYTE_FIXED.ino')
          md = Path('LOGIC_CONTRACT.md')
          log = Path('CODE_CHANGE_LOG.md')

          ino_text = ino.read_text(encoding='utf-8')
          md_text = md.read_text(encoding='utf-8')

          before_ino = "if(parseMode==5){parseCustomFunctionStream((char)in);continue;}if(parseMode==6){"
          after_ino = "if(parseMode==5){parseCustomFunctionStream((char)in);continue;}if(parseMode==4){globalBrightness=constrain(in,(byte)2,(byte)8);parseMode=0;sendAck(F(\"BRIGHTNESS_OK\"));continue;}if(parseMode==6){"
          if ino_text.count(before_ino) != 1:
              raise SystemExit('Expected brightness parser marker exactly once; refusing to edit.')
          ino_text = ino_text.replace(before_ino, after_ino, 1)

          before_md = "| Stream-mode multiplexing | Stream/display modes must follow the same layer-OFF → shift 72 bits → latch → layer-ON electrical sequence; the stream path must not bypass blanking when changing shift-register data. |"
          after_md = "| Display mode | The current firmware uses the buffered display path for built-in, Math, and Custom rendering. No separate Stream mode is implemented or part of the current command protocol. |"
          if md_text.count(before_md) != 1:
              raise SystemExit('Expected Stream-mode contract row exactly once; refusing to edit.')
          md_text = md_text.replace(before_md, after_md, 1)

          ino.write_text(ino_text, encoding='utf-8')
          md.write_text(md_text, encoding='utf-8')

          entry = f'''\n### 2026-09-07 — Fix brightness protocol and remove stale Stream-mode requirement\n\n- File: `LED_Cube_SMODE_512BIT_3BYTE_FIXED.ino`\n- Change type: `FIX`\n- Before: `{before_ino}`\n- After: `{after_ino}`\n- Reason: The web app already sends `B` followed by one brightness byte, but the firmware only changed `parseMode` to 4 and had no handler to consume the following byte. The added handler consumes that byte, clamps it to the supported 2–8 range, resets the parser, and acknowledges the update.\n- Contract/regression checks performed: Preserved `B` command entry point; preserved all existing Auto/Manual/Math/Custom command branches; protocol byte is consumed as control data rather than LED frame data.\n\n- File: `LOGIC_CONTRACT.md`\n- Change type: `BEHAVIOR CHANGE`\n- Before: `{before_md}`\n- After: `{after_md}`\n- Reason: The current firmware has no Stream-mode parser, buffer, command, or rendering path. The previous Stream-mode rule therefore described functionality that does not exist in the current protocol and created a documentation/code inconsistency. The contract is corrected to describe the actual current buffered display implementation rather than inventing a stream feature.\n- Contract/regression checks performed: Built-in, Math, and Custom common display-buffer pipeline remains the documented path; flicker-safe multiplexing row remains unchanged; no command definitions were added or removed.\n\n- HTML check: `index.html` was inspected and not modified because its brightness transmission (`B` + one byte) already matches the contract, and it contains no Stream-mode implementation to reconcile.\n- Commit SHA: recorded by Git in the commit containing these changes.\n'''

          log_text = log.read_text(encoding='utf-8')
          log.write_text(log_text.rstrip() + '\n' + entry, encoding='utf-8')

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-consistency-fix.yml
          git add LED_Cube_SMODE_512BIT_3BYTE_FIXED.ino LOGIC_CONTRACT.md CODE_CHANGE_LOG.md
          git commit -m "Fix brightness protocol and reconcile Stream-mode contract"
          git push origin HEAD:temp-consistency-fix
