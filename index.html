<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8x8x8 LED Cube Console - Custom Function Studio</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e24; color: #f4f4f9; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #2a2a35; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h1, h3 { color: #00d2ff; }
        .status-panel { padding: 15px; border-radius: 6px; font-weight: bold; margin-bottom: 20px; text-align: center; font-size: 1.1em; }
        .disconnected { background-color: #721c24; color: #f8d7da; border: 1px solid #f5c6cb; }
        .connected { background-color: #155724; color: #d4edda; border: 1px solid #c3e6cb; }
        .btn-group { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
        button { background-color: #008cba; color: white; border: none; padding: 12px 20px; text-align: center; font-size: 14px; border-radius: 6px; cursor: pointer; transition: all 0.3s ease; font-weight: bold; }
        button:hover { background-color: #005f73; transform: translateY(-2px); }
        button.connect-btn { background-color: #28a745; }
        button.connect-btn:hover { background-color: #218838; }
        button.disconnect-btn { background-color: #dc3545; }
        button.disconnect-btn:hover { background-color: #c82333; }
        button.action-btn { background-color: #ffc107; color: #212529; }
        button.action-btn:hover { background-color: #e0a96d; }
        textarea { width: 100%; height: 180px; background-color: #111; color: #39ff14; font-family: 'Courier New', Courier, monospace; font-size: 14px; padding: 10px; border: 1px solid #444; border-radius: 6px; box-sizing: border-box; resize: vertical; }
        .brightness-panel { display: flex; align-items: center; gap: 15px; margin: 20px 0; background: #343446; padding: 15px; border-radius: 6px; }
        input[type="range"] { flex-grow: 1; accent-color: #00d2ff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>8x8x8 LED Cube Console</h1>
        
        <div id="statusLabel" class="status-panel disconnected">
            INTERFACE STATUS: DISCONNECTED
        </div>

        <div class="btn-group">
            <button class="connect-btn" id="connectBtn" onclick="connectBLE()">Pair HM-10 BLE Module</button>
            <button class="disconnect-btn" id="disconnectBtn" onclick="disconnectBLE()" style="display:none;">Disconnect Session</button>
        </div>

        <h3>System Controls</h3>
        <div class="btn-group">
            <button onclick="sendCommand('A')">Auto Mode ('A')</button>
            <button onclick="sendCommand('M')">Manual Mode ('M')</button>
            <button class="action-btn" onclick="sendCommand('N')">Next Animation ('N')</button>
        </div>

        <div class="brightness-panel">
            <label for="brightnessRange"><strong>BRIGHTNESS CONTROL:</strong></label>
            <input type="range" id="brightnessRange" min="2" max="8" value="5" onchange="updateBrightness(this.value)">
            <span id="brightnessVal">5</span>
        </div>

        <h3>Custom Function Engine f(x,y,z,f)</h3>
        <div style="margin-bottom: 15px;">
            <textarea id="formulaInput" placeholder="// Custom Math Studio Rules:&#10;// Write code line by line. Use variables or logic conditions.&#10;// End the program with a VOXEL expression statement.&#10;R = sqrt((X-3.5)*(X-3.5) + (Y-3.5)*(Y-3.5))&#10;VOXEL sin(R - F*0.5) > 0.2"></textarea>
        </div>
        <div class="btn-group">
            <button class="connect-btn" onclick="uploadCustomFormula()">Compile Custom Upload & Start</button>
            <button class="disconnect-btn" onclick="sendCommand('S')">Stop Custom</button>
        </div>
    </div>

    <script>
        let bleDevice = null;
        let bleCharacteristic = null;

        // Custom standard HM-10 BLE SPP UUID sets
        const UART_SERVICE_UUID = "0000ffe0-0000-1000-8000-00805f9b34fb";
        const UART_CHAR_UUID    = "0000ffe1-0000-1000-8000-00805f9b34fb";

        async function connectBLE() {
            try {
                console.log("Requesting bluetooth device mapping...");
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [UART_SERVICE_UUID] }],
                    optionalServices: [UART_SERVICE_UUID]
                });

                bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

                console.log("Connecting to GATT server infrastructure...");
                const server = await bleDevice.gatt.connect();

                console.log("Locating layout primary link services...");
                const service = await server.getPrimaryService(UART_SERVICE_UUID);
                bleCharacteristic = await service.getCharacteristic(UART_CHAR_UUID);

                document.getElementById("statusLabel").innerText = "INTERFACE STATUS: CONNECTED";
                document.getElementById("statusLabel").className = "status-panel connected";
                document.getElementById("connectBtn").style.display = "none";
                document.getElementById("disconnectBtn").style.display = "inline-block";
                
                // Fire verification handshake sequence
                setTimeout(() => { sendCommand('H'); }, 600);

            } catch (error) {
                console.error("BLE Setup Failure: ", error);
                alert("Pairing link could not be negotiated: " + error.message);
            }
        }

        function onDisconnected() {
            document.getElementById("statusLabel").innerText = "INTERFACE STATUS: DISCONNECTED";
            document.getElementById("statusLabel").className = "status-panel disconnected";
            document.getElementById("connectBtn").style.display = "inline-block";
            document.getElementById("disconnectBtn").style.display = "none";
            bleCharacteristic = null;
            bleDevice = null;
        }

        function disconnectBLE() {
            if (bleDevice && bleDevice.gatt.connected) {
                bleDevice.gatt.disconnect();
            }
        }

        async function sendCommand(charCmd) {
            if (!bleCharacteristic) {
                alert("Hardware channel unreachable. Pair Bluetooth first!");
                return;
            }
            try {
                const encoder = new TextEncoder();
                await bleCharacteristic.writeValueWithoutResponse(encoder.encode(charCmd));
                console.log(`Executed operational instruction flag: ${charCmd}`);
            } catch (error) {
                console.error("Command Transfer Fault: ", error);
            }
        }

        async function updateBrightness(val) {
            document.getElementById("brightnessVal").innerText = val;
            if (!bleCharacteristic) return;
            try {
                const buffer = new Uint8Array([66, parseInt(val)]); // 'B' = 66 ASCII character code byte
                await bleCharacteristic.writeValueWithoutResponse(buffer);
                console.log(`Dispatched revised global intensity tier: ${val}`);
            } catch (error) {
                console.error("Failed to apply target brightness: ", error);
            }
        }

        async function uploadCustomFormula() {
            if (!bleCharacteristic) {
                alert("Please attach to a valid module before sending formulas.");
                return;
            }

            let text = document.getElementById("formulaInput").value.trim();
            if(!text) {
                alert("Please write a custom formula expression context first.");
                return;
            }

            // Prep full dynamic command context wrapper stream package payload
            let packageData = "CF_BEGIN\n" + text + "\nCF_END\n";
            let encoder = new TextEncoder();
            let byteData = encoder.encode(packageData);

            try {
                // Initialize transaction trigger
                await sendCommand('C');
                // Allow hardware window buffer tracking time to setup clean vectors
                await new Promise(r => setTimeout(r, 400)); 

                console.log("Beginning chunk transmission queue loop...");
                // Break transaction payload into standard BLE ATT MTU blocks of 20 bytes maximum
                const chunkSize = 20;
                for (let i = 0; i < byteData.length; i += chunkSize) {
                    let chunk = byteData.slice(i, i + chunkSize);
                    await bleCharacteristic.writeValueWithoutResponse(chunk);
                    // Crucial pipeline delay so micro-controller buffer does not drop frames
                    await new Promise(r => setTimeout(r, 60)); 
                }
                
                console.log("Transmission complete. Dispatched trigger verification command...");
                await new Promise(r => setTimeout(r, 500));
                await sendCommand('X'); // Execute the compiled custom code block instruction flag

            } catch(err) {
                console.error("Custom calculation string chunk upload failure: ", err);
                alert("Transmission stream drop error encountered: " + err.message);
            }
        }
    </script>
</body>
</html>
