<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8x8x8 LED Cube Console - Hybrid Studio</title>
<style>
:root{--bg-color:#0b0f19;--panel-bg:#151f32;--text-color:#f1f5f9;--text-muted:#94a3b8;--primary:#2563eb;--primary-hover:#1d4ed8;--success:#10b981;--success-hover:#059669;--warning:#f59e0b;--warning-hover:#d97706;--danger:#ef4444;--danger-hover:#dc2626;--border:#334155}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{background:var(--bg-color);color:var(--text-color);padding:20px;display:flex;justify-content:center;align-items:center;min-height:100vh}
.console-container{background:var(--panel-bg);border:1px solid var(--border);border-radius:12px;width:100%;max-width:650px;padding:24px;box-shadow:0 10px 25px -5px rgba(0,0,0,.3)}
h2{font-size:1.5rem;letter-spacing:1px;text-align:center;margin-bottom:20px;color:#fff;border-bottom:2px solid var(--border);padding-bottom:12px}
h3{font-size:1rem;color:var(--text-muted);margin-top:24px;margin-bottom:12px;letter-spacing:.5px}.status-panel{background:rgba(0,0,0,.2);border:1px solid var(--border);padding:12px;border-radius:6px;font-family:monospace;font-size:.9rem;text-align:center;margin-bottom:20px;color:var(--warning)}.status-disconnected{color:var(--danger)}.status-connected{color:var(--success)}
.btn{display:block;width:100%;padding:12px;margin-bottom:12px;border:none;border-radius:6px;font-size:1rem;font-weight:600;cursor:pointer;transition:background-color .2s,opacity .2s;text-align:center;text-transform:uppercase}.btn:disabled{opacity:.4;cursor:not-allowed}.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover:not(:disabled){background:var(--primary-hover)}.btn-success{background:var(--success);color:#fff}.btn-success:hover:not(:disabled){background:var(--success-hover)}.btn-warning{background:var(--warning);color:#fff}.btn-warning:hover:not(:disabled){background:var(--warning-hover)}.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover:not(:disabled){background:var(--danger-hover)}
.control-group{display:grid;grid-template-columns:1fr 1fr;gap:12px}.engine-panel{border-top:1px dashed var(--border);margin-top:20px;padding-top:10px}textarea{width:100%;height:120px;background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:6px;color:#51ff00;font-family:monospace;padding:10px;resize:vertical;margin-bottom:12px;font-size:.85rem}.preview-box{background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:6px;padding:10px;margin-bottom:12px;text-align:center}.preview-label{font-size:.8rem;color:var(--text-muted);margin-bottom:6px;display:flex;justify-content:space-between}.range-container{margin-top:16px;background:rgba(0,0,0,.1);padding:12px;border-radius:6px;border:1px solid var(--border)}.range-label{display:flex;justify-content:space-between;font-size:.9rem;color:var(--text-muted);margin-bottom:6px}input[type=range]{width:100%;accent-color:var(--primary)}
</style>
</head>
<body><div class="console-container">
<h2>8x8x8 LED CUBE CONSOLE</h2><div class="status-panel" id="connectionLog">INTERFACE STATUS: DISCONNECTED</div>
<button id="connectBtn" class="btn btn-primary" onclick="triggerBLELinkSession()">Pair HM-10 BLE Module</button><button id="disconnectBtn" class="btn btn-danger" onclick="terminateConnectionSequence()" style="display:none;margin-bottom:12px;">Disconnect Session</button>
<div class="control-group"><button class="btn btn-success modeControl" onclick="transmitModeToken('A')" disabled>Auto Mode ('A')</button><button class="btn btn-warning modeControl" onclick="transmitModeToken('M')" disabled>Manual Mode ('M')</button></div>
<div class="control-group"><button class="btn btn-primary modeControl" style="background:#ffd600;color:#121212;" onclick="transmitModeToken('N')" disabled>Next Animation ('N')</button><button class="btn btn-warning modeControl" style="background:#06b6d4;color:#fff;" onclick="transmitModeToken('F')" disabled>Math Mode ('F')</button></div>
<div class="engine-panel"><h3>MATHEMATICAL FUNCTION ENGINE f(x,y,z,t)</h3><textarea id="mathIDE" placeholder="z <= 3.5 + 2.5 * sin(sqrt((x-3.5)*(x-3.5) + (y-3.5)*(y-3.5)) * 0.8 - t * 0.2)" oninput="compileMathFunction()"></textarea><div class="preview-box"><div class="preview-label"><span>FRONT FACE PREVIEW — COLUMNS 1-8</span><span id="frameCountLabel">0 Frames Compiled</span></div><canvas id="layerPreviewCanvas" width="160" height="160" style="background:#000;border-radius:4px;width:120px;height:120px;image-rendering:pixelated;"></canvas></div><div class="control-group"><button class="btn btn-primary" style="background:#475569;grid-column:span 2;" onclick="compileMathFunction()">Compile Math Preview</button></div></div>
<div class="engine-panel"><h3>CUSTOM FUNCTION ENGINE f(x,y,z,f)</h3><textarea id="customFuncIDE" placeholder="CUSTOM\nH=(X*3+Y*5+F)%16\nIF H>=8 OFF\nRZ=7-H\nZ=RZ OR Z=RZ+1\nEND"></textarea><div class="control-group"><button class="btn btn-primary" style="background:#475569" onclick="sendCustomFunction()">Send Function</button><button class="btn btn-success" id="runCustomBtn" onclick="startCustomFunction()" disabled>Start Custom</button></div><button class="btn btn-danger" id="stopCustomBtn" onclick="stopCustomFunction()" disabled>Stop Custom</button></div>
<div class="range-container"><div class="range-label"><span>BRIGHTNESS CONTROL:</span><span id="sliderValLabel">5</span></div><input type="range" id="brightnessInputSlider" min="2" max="8" value="5" step="1" oninput="executeBrightnessShift(this.value)" disabled></div>
</div>
<script>
let physicalTargetDevice=null,targetDataCharacteristic=null;const HM10_SERVICE_UUID="0000ffe0-0000-1000-8000-00805f9b34fb",HM10_CHAR_UUID="0000ffe1-0000-1000-8000-00805f9b34fb";let mathFrames=[],bleWriteQueue=Promise.resolve(),webCubeMode="NONE",customReady=false,bleRxText="",ackWaiters=new Map(),commandBusy=false;
function setControlsEnabled(enabled){document.querySelectorAll(".modeControl").forEach(b=>b.disabled=!enabled);document.getElementById("brightnessInputSlider").disabled=!enabled;}
window.addEventListener("DOMContentLoaded",()=>{setControlsEnabled(false);const cachedMath=localStorage.getItem("cube_cached_math_expr");document.getElementById("mathIDE").value=cachedMath||"z <= 3.5 + 2.5 * sin(sqrt((x-3.5)*(x-3.5) + (y-3.5)*(y-3.5)) * 0.8 - t * 0.2)";const cachedCustom=localStorage.getItem("cube_cached_custom_func");document.getElementById("customFuncIDE").value=cachedCustom||"CUSTOM\nH=(X*3+Y*5+F)%16\nIF H>=8 OFF\nRZ=7-H\nZ=RZ OR Z=RZ+1\nEND";compileMathFunction();});
function drawPreview(frameBytes){const canvas=document.getElementById("layerPreviewCanvas");if(!canvas)return;const ctx=canvas.getContext("2d");ctx.fillStyle="#000";ctx.fillRect(0,0,canvas.width,canvas.height);const cellW=canvas.width/8,cellH=canvas.height/8;for(let row=0;row<8;row++){const z=7-row;const y=0;for(let x=0;x<8;x++){const i=z*64+y*8+x;if((frameBytes[i>>3]&(1<<(i&7)))!==0){ctx.fillStyle="#51ff00";ctx.fillRect(x*cellW+1,row*cellH+1,cellW-2,cellH-2);}}}}
function compileMathFunction(){mathFrames=[];const exprStr=document.getElementById("mathIDE").value.trim();localStorage.setItem("cube_cached_math_expr",exprStr);for(let f=0;f<50;f++){let frameBytes=new Uint8Array(64),t=f;for(let z=0;z<8;z++)for(let y=0;y<8;y++)for(let x=0;x<8;x++){const X=x,Y=y,Z=z,F=f,T=f,matched=(()=>{try{return !!eval(exprStr);}catch(e){return false;}})();if(matched){const i=z*64+y*8+x;frameBytes[i>>3]|=1<<(i&7);}}mathFrames.push({bytes:frameBytes,delay:200});}document.getElementById("frameCountLabel").innerText=mathFrames.length+" Frame(s) Compiled";if(mathFrames.length)drawPreview(mathFrames[0].bytes);return mathFrames.length;}
function waitForProtocolAck(expected,timeoutMs=4000){return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{if(ackWaiters.get(expected)?.timer===timer)ackWaiters.delete(expected);reject(new Error("Timed out waiting for "+expected));},timeoutMs);ackWaiters.set(expected,{resolve,reject,timer});});}
function waitForProtocolAckAny(expectedMessages,timeoutMs=5000){return new Promise((resolve,reject)=>{const keys=[...expectedMessages];let done=false;const timers=[];const finish=(ok,value)=>{if(done)return;done=true;for(const t of timers)clearTimeout(t);for(const key of keys)if(ackWaiters.get(key)?.group===group)ackWaiters.delete(key);ok?resolve(value):reject(new Error("Timed out waiting for "+keys.join(" or ")));};const group={finish};for(const key of keys){const timer=setTimeout(()=>finish(false),timeoutMs);timers.push(timer);ackWaiters.set(key,{resolve:(message)=>finish(true,message),reject,timer,group});}});}
function resolveProtocolAck(message){const waiter=ackWaiters.get(message);if(!waiter)return false;clearTimeout(waiter.timer);if(waiter.group){waiter.group.finish(true,message);}else{ackWaiters.delete(message);waiter.resolve(message);}return true;}
function rejectAllProtocolWaiters(reason){for(const waiter of ackWaiters.values()){clearTimeout(waiter.timer);waiter.reject(new Error(reason));}ackWaiters.clear();}
async function triggerBLELinkSession(){const log=document.getElementById("connectionLog");log.innerText="SEARCHING...";setControlsEnabled(false);try{physicalTargetDevice=await navigator.bluetooth.requestDevice({filters:[{services:[HM10_SERVICE_UUID]}],optionalServices:[HM10_SERVICE_UUID]});log.innerText="CONNECTING TO GATT LAYER...";const server=await physicalTargetDevice.gatt.connect(),service=await server.getPrimaryService(HM10_SERVICE_UUID);targetDataCharacteristic=await service.getCharacteristic(HM10_CHAR_UUID);await targetDataCharacteristic.startNotifications();targetDataCharacteristic.addEventListener('characteristicvaluechanged',onDataNotificationsReceived);physicalTargetDevice.addEventListener('gattserverdisconnected',cleanSessionStateWipe);bleRxText="";const handshake=waitForProtocolAck("HANDSHAKE_OK",4000);await queueBLEWrite(new TextEncoder().encode("H"));await handshake;log.innerText="INTERFACE STATUS: HANDSHAKE VERIFIED";log.className="status-panel status-connected";document.getElementById('connectBtn').style.display="none";document.getElementById('disconnectBtn').style.display="block";setControlsEnabled(true);webCubeMode="NONE";customReady=false;document.getElementById("runCustomBtn").disabled=true;}catch(e){rejectAllProtocolWaiters("Connection failed");targetDataCharacteristic=null;webCubeMode="NONE";log.innerText="HANDSHAKE FAILED";log.className="status-panel status-disconnected";setControlsEnabled(false);try{if(physicalTargetDevice&&physicalTargetDevice.gatt.connected)physicalTargetDevice.gatt.disconnect();}catch(_){}alert("Connection/handshake failed: "+e.message);}}
function onDataNotificationsReceived(event){bleRxText+=new TextDecoder('utf-8').decode(event.target.value);let parts=bleRxText.split("\n");bleRxText=parts.pop();for(const raw of parts){const cleanData=raw.replace(/\r/g,"").trim();if(!cleanData)continue;resolveProtocolAck(cleanData);const log=document.getElementById("connectionLog");if(cleanData==="HANDSHAKE_OK"){log.innerText="INTERFACE STATUS: HANDSHAKE VERIFIED";log.className="status-panel status-connected";}else if(cleanData==="MODE_AUTO"){webCubeMode="A";log.innerText="AUTO MODE ACTIVE";log.className="status-panel status-connected";}else if(cleanData==="MODE_MANUAL"){webCubeMode="M";log.innerText="MANUAL MODE ACTIVE";log.className="status-panel status-connected";}else if(cleanData==="ANIMATION_NEXT"){log.innerText="NEXT ANIMATION ACTIVE";log.className="status-panel status-connected";}else if(cleanData==="MATH_UPLOAD_READY"){log.innerText="MATH UPLOAD CHANNEL READY";log.className="status-panel status-connected";}else if(cleanData==="MATH_OK"){log.innerText="MATH FUNCTION READY";log.className="status-panel status-connected";}else if(cleanData==="MATH_STARTED"){webCubeMode="F";log.innerText="MATH MODE ACTIVE";log.className="status-panel status-connected";}else if(cleanData==="MATH_NOT_READY"){log.innerText="MATH FUNCTION NOT READY";log.className="status-panel status-disconnected";}else if(cleanData==="MATH_ERROR"){log.innerText="MATH FUNCTION ERROR";log.className="status-panel status-disconnected";}else if(cleanData==="CUSTOM_UPLOAD_READY"){log.innerText="CUSTOM UPLOAD CHANNEL READY";log.className="status-panel status-connected";}else if(cleanData==="CUSTOM_OK"){customReady=true;document.getElementById("runCustomBtn").disabled=false;log.innerText="CUSTOM FUNCTION READY";log.className="status-panel status-connected";}else if(cleanData==="CUSTOM_ERROR"){customReady=false;document.getElementById("runCustomBtn").disabled=true;log.innerText="CUSTOM FUNCTION ERROR";log.className="status-panel status-disconnected";}else if(cleanData==="CUSTOM_STARTED"){webCubeMode="CUSTOM";document.getElementById("stopCustomBtn").disabled=false;log.innerText="CUSTOM MODE ACTIVE";log.className="status-panel status-connected";}else if(cleanData==="CUSTOM_STOPPED"){webCubeMode="A";document.getElementById("stopCustomBtn").disabled=true;log.innerText="CUSTOM MODE STOPPED — AUTO MODE ACTIVE";log.className="status-panel status-connected";}else if(cleanData==="CUSTOM_NOT_ACTIVE"){log.innerText="CUSTOM MODE NOT ACTIVE";log.className="status-panel status-connected";}else if(cleanData==="CUSTOM_NOT_READY"){customReady=false;document.getElementById("runCustomBtn").disabled=true;log.innerText="CUSTOM FUNCTION NOT READY";log.className="status-panel status-disconnected";}else if(cleanData==="BRIGHTNESS_OK"){log.innerText="BRIGHTNESS UPDATED";log.className="status-panel status-connected";}else if(cleanData==="BRIGHTNESS_ERROR"){log.innerText="BRIGHTNESS ERROR";log.className="status-panel status-disconnected";}}}
function cleanSessionStateWipe(){rejectAllProtocolWaiters("Bluetooth disconnected");bleRxText="";targetDataCharacteristic=null;physicalTargetDevice=null;webCubeMode="NONE";customReady=false;document.getElementById('runCustomBtn').disabled=true;document.getElementById('stopCustomBtn').disabled=true;setControlsEnabled(false);const log=document.getElementById('connectionLog');log.innerText="DISCONNECTED";log.className="status-panel status-disconnected";document.getElementById('connectBtn').style.display="block";document.getElementById('disconnectBtn').style.display="none";}
async function terminateConnectionSequence(){if(physicalTargetDevice&&physicalTargetDevice.gatt.connected){try{physicalTargetDevice.gatt.disconnect();}catch(e){}}cleanSessionStateWipe();}
function queueBLEWrite(data){bleWriteQueue=bleWriteQueue.catch(()=>{}).then(async()=>{if(!targetDataCharacteristic)throw new Error("Bluetooth disconnected.");let attempts=0;while(attempts<5){try{await targetDataCharacteristic.writeValueWithoutResponse(data);return;}catch(e){attempts++;if(!(e&&e.message||"").toLowerCase().includes("already in progress"))throw e;await new Promise(r=>setTimeout(r,100));}}throw new Error("BLE GATT remained busy after multiple retries.");});return bleWriteQueue;}
async function executeBrightnessShift(val){document.getElementById("sliderValLabel").innerText=val;try{await queueBLEWrite(new Uint8Array([0x42,parseInt(val,10)]));}catch(e){console.error(e);}}
async function sendMathFunction(){if(!targetDataCharacteristic)throw new Error("Bluetooth disconnected.");const expr=document.getElementById("mathIDE").value.trim();if(!expr)throw new Error("Math expression is empty.");const enc=new TextEncoder();const begin=waitForProtocolAck("MATH_UPLOAD_READY",5000);await queueBLEWrite(enc.encode("Y"));await begin;const result=waitForProtocolAckAny(["MATH_OK","MATH_ERROR"],7000);const payload=expr+"\n";for(let i=0;i<payload.length;i+=20){await queueBLEWrite(enc.encode(payload.slice(i,i+20)));await new Promise(r=>setTimeout(r,15));}const ack=await result;if(ack!=="MATH_OK")throw new Error("Arduino rejected the math function.");}
async function transmitModeToken(c){if(!targetDataCharacteristic||commandBusy)return;if(c==="N"&&webCubeMode!=="M")return;commandBusy=true;try{if(c==="A"){const ack=waitForProtocolAck("MODE_AUTO");await queueBLEWrite(new TextEncoder().encode("A"));await ack;}else if(c==="M"){const ack=waitForProtocolAck("MODE_MANUAL");await queueBLEWrite(new TextEncoder().encode("M"));await ack;}else if(c==="N"){const ack=waitForProtocolAck("ANIMATION_NEXT");await queueBLEWrite(new TextEncoder().encode("N"));await ack;}else if(c==="F"){await sendMathFunction();const ack=waitForProtocolAck("MATH_STARTED");await queueBLEWrite(new TextEncoder().encode("F"));await ack;}}catch(e){const log=document.getElementById("connectionLog");log.innerText="COMMAND FAILED: "+e.message;log.className="status-panel status-disconnected";console.error(e);}finally{commandBusy=false;}}
async function sendCustomFunction(){if(!targetDataCharacteristic){alert("Please complete the Bluetooth handshake first!");return;}if(commandBusy)return;const code=document.getElementById("customFuncIDE").value.trim();if(!code){alert("Custom function is empty.");return;}commandBusy=true;localStorage.setItem("cube_cached_custom_func",code);const log=document.getElementById("connectionLog");customReady=false;document.getElementById("runCustomBtn").disabled=true;log.innerText="REQUESTING CUSTOM UPLOAD CHANNEL...";log.className="status-panel";try{const enc=new TextEncoder();const begin=waitForProtocolAck("CUSTOM_UPLOAD_READY",5000);await queueBLEWrite(enc.encode("C"));await begin;log.innerText="SENDING CUSTOM FUNCTION...";const result=waitForProtocolAckAny(["CUSTOM_OK","CUSTOM_ERROR"],10000);const payload=code+"\nCF_END\n";for(let i=0;i<payload.length;i+=20){await queueBLEWrite(enc.encode(payload.slice(i,i+20)));await new Promise(r=>setTimeout(r,20));}const ack=await result;if(ack!=="CUSTOM_OK")throw new Error("Arduino rejected the custom function.");}catch(e){log.innerText="FUNCTION SEND FAILED: "+e.message;log.className="status-panel status-disconnected";alert("Failed to send custom function: "+e.message);}finally{commandBusy=false;}}
async function startCustomFunction(){if(!targetDataCharacteristic){alert("Please complete the Bluetooth handshake first!");return;}if(!customReady){alert("Send the custom function and wait for CUSTOM FUNCTION READY.");return;}if(commandBusy)return;commandBusy=true;try{const ack=waitForProtocolAck("CUSTOM_STARTED");await queueBLEWrite(new TextEncoder().encode("X"));await ack;}catch(e){alert("Failed to start custom function: "+e.message);}finally{commandBusy=false;}}
async function stopCustomFunction(){if(!targetDataCharacteristic||commandBusy)return;commandBusy=true;try{const ack=waitForProtocolAckAny(["CUSTOM_STOPPED","CUSTOM_NOT_ACTIVE"]);await queueBLEWrite(new TextEncoder().encode("S"));await ack;document.getElementById("stopCustomBtn").disabled=true;}catch(e){alert("Failed to stop custom function: "+e.message);}finally{commandBusy=false;}}
</script></body></html>
