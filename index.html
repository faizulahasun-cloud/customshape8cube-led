<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>8x8x8 LED Cube Console - Script Engine</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #E0E0E0; padding: 20px; margin: 0; }
        .dashboard-container { max-width: 650px; margin: 10px auto; background: #1E1E1E; border: 1px solid #2D2D2D; border-radius: 12px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h2, h3 { margin-top: 0; color: #FFFFFF; font-weight: 600; border-bottom: 1px solid #2D2D2D; padding-bottom: 10px; }
        .status-box { background: #262626; padding: 12px 18px; border-radius: 6px; font-weight: bold; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
        .status-disconnected { color: #FF5252; }
        .status-connected { color: #00E676; }
        .control-grid { display: flex; flex-direction: column; gap: 12px; }
        .btn { width: 100%; background: #2979FF; color: #FFFFFF; border: none; padding: 12px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn:hover { background: #2962FF; }
        .btn-disconnect { background: #333333; border: 1px solid #444; }
        .btn-disconnect:hover { background: #D50000; }
        .btn-action { background: #00E676; color: #121212; }
        .btn-s-mode { background: #AA00FF; color: #FFFFFF; font-size: 16px; padding: 15px; border: 2px solid #D500F9; }
        .btn-s-mode:hover { background: #8E00C7; }
        .slider-block { background: #262626; border: 1px solid #333; padding: 12px; border-radius: 6px; }
        textarea { width: 100%; height: 120px; background: #121212; color: #00E676; border: 1px solid #333; border-radius: 6px; padding: 10px; font-family: monospace; box-sizing: border-box; }
        input[type=file] { margin-bottom: 10px; color: #CCC; }
    </style>
</head>
<body>

<div class="dashboard-container">
    <h2>8x8x8 CUBE ADVANCED ENGINE</h2>
    
    <div class="status-box">
        <span>INTERFACE STATUS:</span>
        <span id="connectionLog" class="status-disconnected">DISCONNECTED</span>
    </div>

    <div class="control-grid">
        <button id="connectBtn" class="btn" onclick="triggerBLELinkSession()">Pair HM-10 BLE Module</button>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button class="btn btn-action" onclick="transmitModeToken('A')">Auto Mode ('A')</button>
            <button class="btn btn-action" onclick="transmitModeToken('M')">Manual Mode ('M')</button>
        </div>

        <button class="btn" style="background:#FFD600; color:#121212;" onclick="transmitModeToken('N')">Next Pattern Step ('N')</button>

        <h3>CUSTOM .TXT CODE ENGINE (MODE 'S')</h3>
        <p style="font-size: 12px; color: #888; margin: 0;">Upload a .txt script file or write XYZ code. Script automatically saves to local browser storage.</p>
        
        <input type="file" id="txtFileInput" accept=".txt" onchange="loadTxtFile(this)">
        <textarea id="scriptEditor" placeholder="Enter XYZ commands like set(0,0,0) or 64 hex bytes..."></textarea>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button class="btn" style="background:#444;" onclick="saveToLocalStorage()">Save Script to Storage</button>
            <button class="btn" style="background:#00B0FF;" onclick="parseAndCompileScript()">Compile Code Engine</button>
        </div>

        <!-- DEDICATED S-MODE TRANSMISSION BUTTON -->
        <button class="btn btn-s-mode" onclick="executeSModeTransferEngine()">RUN 'S' MODE ENGINE (WAIT FOR DATA COMPLETION)</button>

        <div class="slider-block">
            <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                <span>BRIGHTNESS CONTROL:</span>
                <span id="sliderValLabel">5</span>
            </div>
            <input type="range" id="brightnessInputSlider" min="2" max="8" value="5" step="1" oninput="executeBrightnessShift(this.value)">
        </div>

        <button id="disconnectBtn" class="btn btn-disconnect" onclick="terminateConnectionSequence()" style="display:none;">Disconnect Session</button>
    </div>
</div>

<script>
    const HM10_SERVICE_UUID = '0000ffe0-0000-1000-8000-00805f9b34fb';
    const HM10_CHAR_UUID    = '0000ffe1-0000-1000-8000-00805f9b34fb';

    let physicalTargetDevice = null;
    let targetDataCharacteristic = null;
    let compiled64ByteArray = new Uint8Array(64);

    window.onload = function() {
        const savedScript = localStorage.getItem("cube_txt_script");
        if (savedScript) {
            document.getElementById("scriptEditor").value = savedScript;
            parseAndCompileScript();
        } else {
            // Default sample script
            document.getElementById("scriptEditor").value = "// Sample Script\nset(0,0,0)\nset(7,7,7)\nset(3,3,3)";
            parseAndCompileScript();
        }
    };

    async function triggerBLELinkSession() {
        const statusDisplay = document.getElementById('connectionLog');
        try {
            statusDisplay.innerText = "SEARCHING...";
            physicalTargetDevice = await navigator.bluetooth.requestDevice({
                filters: [{ services: [HM10_SERVICE_UUID] }]
            });
            const targetGattServer = await physicalTargetDevice.gatt.connect();
            const targetService = await targetGattServer.getPrimaryService(HM10_SERVICE_UUID);
            targetDataCharacteristic = await targetService.getCharacteristic(HM10_CHAR_UUID);

            statusDisplay.innerText = "CONNECTED";
            statusDisplay.className = "status-connected";
            document.getElementById('connectBtn').style.display = "none";
            document.getElementById('disconnectBtn').style.display = "block";

            physicalTargetDevice.addEventListener('gattserverdisconnected', cleanSessionStateWipe);
        } catch(error) {
            statusDisplay.innerText = "DISCONNECTED";
            statusDisplay.className = "status-disconnected";
            alert("Connection Failed: " + error.message);
        }
    }

    async function transmitModeToken(tokenChar) {
        if (!targetDataCharacteristic) return;
        const buffer = new TextEncoder().encode(tokenChar);
        await targetDataCharacteristic.writeValueWithoutResponse(buffer);
    }

    async function executeBrightnessShift(val) {
        document.getElementById('sliderValLabel').innerText = val;
        if (!targetDataCharacteristic) return;
        const dataPayload = new Uint8Array([66, parseInt(val)]);
        await targetDataCharacteristic.writeValueWithoutResponse(dataPayload);
    }

    function loadTxtFile(input) {
        let file = input.files[0];
        if (!file) return;
        let reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById("scriptEditor").value = e.target.result;
            saveToLocalStorage();
            parseAndCompileScript();
        };
        reader.readAsText(file);
    }

    function saveToLocalStorage() {
        const script = document.getElementById("scriptEditor").value;
        localStorage.setItem("cube_txt_script", script);
    }

    function parseAndCompileScript() {
        saveToLocalStorage();
        const text = document.getElementById("scriptEditor").value;
        compiled64ByteArray.fill(0); // Reset matrix

        const lines = text.split('\n');
        lines.forEach(line => {
            line = line.trim();
            // Parse set(x,y,z) coordinate commands
            let match = line.match(/set\s*\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)/i);
            if (match) {
                let x = parseInt(match[1]);
                let y = parseInt(match[2]);
                let z = parseInt(match[3]);
                if (x >= 0 && x < 8 && y >= 0 && y < 8 && z >= 0 && z < 8) {
                    let index = z * 8 + y;
                    compiled64ByteArray[index] |= (1 << x);
                }
            }
        });
    }

    // --- DEDICATED MODE 'S' ENGINE: WAITS FOR COMPLETE BLUETOOTH DATA DELIVERY ---
    async function executeSModeTransferEngine() {
        if (!targetDataCharacteristic) {
            alert("Please connect to Bluetooth HM-10 first!");
            return;
        }

        parseAndCompileScript(); // Ensure script is compiled

        const statusDisplay = document.getElementById('connectionLog');
        statusDisplay.innerText = "TRANSMITTING DATA...";

        // Construct 66-byte packet: [0xFF, 'S', ...64 Data Bytes...]
        let packet = new Uint8Array(66);
        packet[0] = 0xFF; // Frame Header
        packet[1] = 83;   // ASCII 'S' command code
        packet.set(compiled64ByteArray, 2);

        // Send packet in 16-byte chunks with safe delay intervals
        const CHUNK_SIZE = 16;
        for (let i = 0; i < packet.length; i += CHUNK_SIZE) {
            const chunk = packet.slice(i, i + CHUNK_SIZE);
            await targetDataCharacteristic.writeValueWithoutResponse(chunk);
            await new Promise(r => setTimeout(r, 80)); // 80ms chunk interval guarantees complete receive
        }

        statusDisplay.innerText = "CONNECTED (MODE 'S' RUNNING)";
    }

    async function terminateConnectionSequence() {
        if (!physicalTargetDevice) return;
        if (physicalTargetDevice.gatt.connected) {
            await transmitModeToken('Q');
            await physicalTargetDevice.gatt.disconnect();
        }
    }

    function cleanSessionStateWipe() {
        document.getElementById('connectionLog').innerText = "DISCONNECTED";
        document.getElementById('connectionLog').className = "status-disconnected";
        document.getElementById('connectBtn').style.display = "block";
        document.getElementById('disconnectBtn').style.display = "none";
        targetDataCharacteristic = null;
        physicalTargetDevice = null;
    }
</script>
</body>
</html>
