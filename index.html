<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>8x8x8 LED Cube Console - Layer Stream Engine</title>
<style>
:root{--bg-color:#0b0f19;--panel-bg:#151f32;--text-color:#f1f5f9;--text-muted:#94a3b8;--primary:#2563eb;--primary-hover:#1d4ed8;--success:#10b981;--success-hover:#059669;--warning:#f59e0b;--warning-hover:#d97706;--danger:#ef4444;--danger-hover:#dc2626;--border:#334155}*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}body{background:var(--bg-color);color:var(--text-color);padding:20px;display:flex;justify-content:center;align-items:center;min-height:100vh}.console-container{background:var(--panel-bg);border:1px solid var(--border);border-radius:12px;width:100%;max-width:600px;padding:24px;box-shadow:0 10px 25px -5px rgba(0,0,0,.3)}h2{font-size:1.5rem;letter-spacing:1px;text-align:center;margin-bottom:20px;color:#fff;border-bottom:2px solid var(--border);padding-bottom:12px}h3{font-size:1rem;color:var(--text-muted);margin-top:24px;margin-bottom:12px;letter-spacing:.5px}.status-panel{background:rgba(0,0,0,.2);border:1px solid var(--border);padding:12px;border-radius:6px;font-family:monospace;font-size:.9rem;text-align:center;margin-bottom:20px;color:var(--warning)}.btn{display:block;width:100%;padding:12px;margin-bottom:12px;border:none;border-radius:6px;font-size:1rem;font-weight:600;cursor:pointer;transition:background-color .2s,opacity .2s;text-align:center}.btn:disabled{opacity:.4;cursor:not-allowed}.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover:not(:disabled){background:var(--primary-hover)}.btn-success{background:var(--success);color:#fff}.btn-success:hover:not(:disabled){background:var(--success-hover)}.btn-warning{background:var(--warning);color:#fff}.btn-warning:hover:not(:disabled){background:var(--warning-hover)}.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover:not(:disabled){background:var(--danger-hover)}.btn-s-mode{background:#8b5cf6;color:#fff;margin-top:10px}.btn-s-mode:hover:not(:disabled){background:#7c3aed}.control-group{display:grid;grid-template-columns:1fr 1fr;gap:12px}.engine-panel{border-top:1px dashed var(--border);margin-top:20px;padding-top:10px}textarea{width:100%;height:150px;background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:6px;color:#51ff00;font-family:monospace;padding:10px;resize:vertical;margin-bottom:12px;font-size:.85rem}.file-input-wrapper{margin-bottom:12px}input[type=file]{display:none}.file-label{display:block;background:#334155;color:var(--text-color);padding:10px;text-align:center;border-radius:6px;cursor:pointer;font-size:.9rem;border:1px solid var(--border)}.file-label:hover{background:#475569}.preview-box{background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:6px;padding:10px;margin-bottom:12px;text-align:center}.preview-label{font-size:.8rem;color:var(--text-muted);margin-bottom:6px;display:flex;justify-content:space-between}.range-container{margin-top:16px;background:rgba(0,0,0,.1);padding:12px;border-radius:6px;border:1px solid var(--border)}.range-label{display:flex;justify-content:space-between;font-size:.9rem;color:var(--text-muted);margin-bottom:6px}input[type=range]{width:100%;accent-color:var(--primary)}
</style>
</head>
<body>
<div class="console-container">
<h2>8x8x8 CUBE LAYER-STREAM ENGINE</h2>
<div class="status-panel" id="connectionLog">INTERFACE STATUS: DISCONNECTED</div>
<button class="btn btn-primary" onclick="connectBLE()">Pair HM-10 BLE Module</button>
<div class="control-group">
<button class="btn btn-success" onclick="transmitModeToken('A')">Auto Mode ('A')</button>
<button class="btn btn-warning" onclick="transmitModeToken('M')">Manual Mode ('M')</button>
</div>
<button class="btn btn-primary" onclick="transmitModeToken('N')">Next Pattern Step ('N')</button>
<button class="btn btn-s-mode" onclick="enterSMode()">S MODE</button>
<div class="engine-panel">
<h3>CUSTOM .TXT CODE ENGINE (LAYER STREAM)</h3>
<div class="file-input-wrapper"><label class="file-label" for="txtFileInput" id="fileInputLabel">Choose Script File (.txt)</label><input type="file" id="txtFileInput" accept=".txt" onchange="handleFileLoad(event)"></div>
<textarea id="scriptIDE" placeholder="set(3,3,0)&#10;delay 100&#10;set(3,3,1)&#10;delay 100" oninput="parseAndCompileScript()"></textarea>
<div class="preview-box">
<div class="preview-label"><span>LIVE FRAME PREVIEW (Layer 0):</span><span id="frameCountLabel">0 Frames Compiled</span></div>
<canvas id="layerPreviewCanvas" width="160" height="160" style="background:#000;border-radius:4px;width:120px;height:120px;image-rendering:pixelated;"></canvas>
</div>
<div class="control-group">
<button class="btn btn-primary" style="background:#475569" onclick="saveToStorage()">Save Script</button>
<button class="btn btn-primary" style="background:#475569" onclick="parseAndCompileScript()">Compile Code</button>
</div>
<button class="btn btn-s-mode" id="runScriptButton" onclick="executeSModeTransferEngine()" disabled>DRAW / RUN CUSTOM SCRIPT</button>
</div>
<div class="range-container">
<div class="range-label"><span>BRIGHTNESS CONTROL:</span><span id="brightnessVal">5</span></div>
<input type="range" id="brightnessRange" min="2" max="8" value="5" oninput="updateBrightness(this.value)">
</div>
<button class="btn btn-danger" style="margin-top:20px;margin-bottom:0" onclick="disconnectBLE()">Disconnect Session</button>
</div>
<script>
let targetDevice = null, targetDataCharacteristic = null;
const HM10_SERVICE_UUID = "0000ffe0-0000-1000-8000-00805f9b34fb";
const HM10_CHARACTERISTIC_UUID = "0000ffe1-0000-1000-8000-00805f9b34fb";
let scriptFrames = [], scriptPlaybackRunning = false, scriptPlaybackToken = 0;
let bleWriteQueue = Promise.resolve();
let webCubeMode = "NONE";

function updateSModeUI(){
  document.getElementById("runScriptButton").disabled = (webCubeMode !== "S" || !targetDataCharacteristic || scriptFrames.length === 0);
}

window.addEventListener("DOMContentLoaded", () => {
  const cached = localStorage.getItem("cube_cached_script_layer");
  if(cached) document.getElementById("scriptIDE").value = cached;
  parseAndCompileScript();
  updateSModeUI();
});

function saveToStorage(){
  const code = document.getElementById("scriptIDE").value;
  localStorage.setItem("cube_cached_script_layer", code);
  alert("Script saved successfully!");
}

function handleFileLoad(event){
  const input = event.target;
  if(!input.files || !input.files.length) return;
  const file = input.files[0];
  document.getElementById("fileInputLabel").innerText = file.name;
  const reader = new FileReader();
  reader.onload = () => {
    document.getElementById("scriptIDE").value = reader.result;
    localStorage.setItem("cube_cached_script_layer", reader.result);
    const count = parseAndCompileScript();
    document.getElementById("connectionLog").innerText = "SCRIPT LOADED: " + count + " FRAME(S)";
  };
  reader.readAsText(file);
}

function parseDelayCommand(line){
  const m = line.match(/^delay\s*(?:\(\s*)?(\d+)(?:\s*\))?\s*$/i);
  if(!m) return null;
  const value = parseInt(m[1], 10);
  return Number.isFinite(value) ? Math.max(0, value) : null;
}

function drawPreview(frameBytes){
  const canvas = document.getElementById("layerPreviewCanvas");
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  const cellW = canvas.width / 8;
  const cellH = canvas.height / 8;

  for(let y = 0; y < 8; y++){
    for(let x = 0; x < 8; x++){
      // Preview Layer 0 (z = 0)
      const index = 0 * 64 + y * 8 + x;
      const byteIndex = index >> 3;
      const bitIndex = index & 7;
      const isOn = (frameBytes[byteIndex] & (1 << bitIndex)) !== 0;

      if(isOn){
        ctx.fillStyle = "#51ff00";
        ctx.fillRect(x * cellW + 1, y * cellH + 1, cellW - 2, cellH - 2);
      }
    }
  }
}

function parseAndCompileScript(){
  scriptFrames = [];
  const lines = document.getElementById("scriptIDE").value.split(/\r?\n/);
  let frameBytes = new Uint8Array(64);
  let frameOpen = false;
  let hasCommands = false;
  let pendingDelay = null;
  const defaultDelay = 250;

  function pushFrame(force = false){
    if(!hasCommands && !force) return;
    scriptFrames.push({bytes: frameBytes.slice(), delay: (pendingDelay === null ? defaultDelay : pendingDelay)});
    frameBytes = new Uint8Array(64);
    pendingDelay = null;
    hasCommands = false;
    frameOpen = false;
  }

  for(let line of lines){
    line = line.trim();
    if(!line || line.startsWith("//") || line.startsWith("#")) continue;

    const upper = line.toUpperCase();
    if(upper === "FRAME_START"){
      if(hasCommands) pushFrame();
      frameOpen = true;
      frameBytes = new Uint8Array(64);
      hasCommands = false;
      pendingDelay = null;
      continue;
    }

    if(upper === "FRAME_END"){
      pushFrame(true);
      continue;
    }

    const delay = parseDelayCommand(line);
    if(delay !== null){
      pendingDelay = delay;
      if(hasCommands && !frameOpen) pushFrame();
      continue;
    }

    if(upper === "NEXT"){
      if(hasCommands) pushFrame();
      else if(frameOpen) pushFrame(true);
      continue;
    }

    const m = line.match(/set\s*\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)/i);
    if(!m) continue;

    const x = parseInt(m[1], 10), y = parseInt(m[2], 10), z = parseInt(m[3], 10);
    if(x < 0 || x >= 8 || y < 0 || y >= 8 || z < 0 || z >= 8) continue;

    const index = z * 64 + y * 8 + x;
    const byteIndex = index >> 3;
    const bitIndex = index & 7;
    frameBytes[byteIndex] |= (1 << bitIndex);
    hasCommands = true;
  }

  if(hasCommands) pushFrame();
  
  const count = scriptFrames.length;
  document.getElementById("frameCountLabel").innerText = count + " Frame(s) Compiled";
  if(count > 0) drawPreview(scriptFrames[0].bytes);
  
  updateSModeUI();
  return count;
}

async function connectBLE(){
  const log = document.getElementById("connectionLog");
  log.innerText = "REQUESTING BLE DEVICE...";
  log.style.color = "var(--warning)";

  try{
    targetDevice = await navigator.bluetooth.requestDevice({
      filters: [{services: [HM10_SERVICE_UUID]}],
      optionalServices: [HM10_SERVICE_UUID]
    });

    log.innerText = "CONNECTING TO GATT LAYER...";
    const server = await targetDevice.gatt.connect();

    log.innerText = "PARSING HM-10 SERVICE...";
    const service = await server.getPrimaryService(HM10_SERVICE_UUID);

    log.innerText = "ACQUIRING RX/TX CHARACTERISTIC...";
    targetDataCharacteristic = await service.getCharacteristic(HM10_CHARACTERISTIC_UUID);

    log.innerText = "INTERFACE STATUS: CONNECTED";
    log.style.color = "var(--success)";

    webCubeMode = "NONE";
    scriptPlaybackRunning = false;
    scriptPlaybackToken++;
    updateSModeUI();

    targetDevice.addEventListener("gattserverdisconnected", onDisconnected);
  }catch(e){
    console.error(e);
    targetDataCharacteristic = null;
    webCubeMode = "NONE";
    scriptPlaybackRunning = false;
    scriptPlaybackToken++;
    updateSModeUI();
    log.innerText = "CONNECTION FAILED";
    log.style.color = "var(--danger)";
    alert("BLE Handshake failed: " + e.message);
  }
}

function onDisconnected(){
  scriptPlaybackRunning = false;
  scriptPlaybackToken++;
  targetDataCharacteristic = null;
  webCubeMode = "NONE";
  updateSModeUI();
  const log = document.getElementById("connectionLog");
  log.innerText = "INTERFACE STATUS: DISCONNECTED";
  log.style.color = "var(--warning)";
}

function disconnectBLE(){
  scriptPlaybackRunning = false;
  scriptPlaybackToken++;
  targetDataCharacteristic = null;
  webCubeMode = "NONE";
  updateSModeUI();
  if(targetDevice && targetDevice.gatt.connected) targetDevice.gatt.disconnect();
  else{
    const log = document.getElementById("connectionLog");
    log.innerText = "INTERFACE STATUS: DISCONNECTED";
    log.style.color = "var(--warning)";
  }
}

function queueBLEWrite(data, token = null){
  bleWriteQueue = bleWriteQueue.catch(() => {}).then(async() => {
    if(!targetDataCharacteristic) throw new Error("Bluetooth disconnected.");
    if(token !== null && token !== scriptPlaybackToken) return;

    let attempts = 0;
    while(attempts < 5){
      if(token !== null && token !== scriptPlaybackToken) return;
      try{
        await targetDataCharacteristic.writeValueWithoutResponse(data);
        return;
      }catch(e){
        attempts++;
        const msg = e && e.message ? e.message : "";
        if(!msg.toLowerCase().includes("already in progress")) throw e;
        await new Promise(r => setTimeout(r, 100));
      }
    }
    throw new Error("BLE GATT remained busy after multiple retries.");
  });
  return bleWriteQueue;
}

async function updateBrightness(val){
  document.getElementById("brightnessVal").innerText = val;
  if(webCubeMode === "S") return;
  try{
    await queueBLEWrite(new Uint8Array([0x42, parseInt(val, 10)]));
  }catch(e){
    console.error("Brightness transmission:", e);
  }
}

async function transmitModeToken(c){
  if(!targetDataCharacteristic) return;
  if(c === "N" && webCubeMode !== "M") return;

  const leavingS = (webCubeMode === "S" && (c === "A" || c === "M" || c === "Q"));

  if(c === "A" || c === "M" || c === "Q"){
    scriptPlaybackRunning = false;
    scriptPlaybackToken++;
  }

  if(c === "A") webCubeMode = "A";
  else if(c === "M") webCubeMode = "M";
  else if(c === "Q") webCubeMode = "A";

  updateSModeUI();

  try{
    if(leavingS) await new Promise(r => setTimeout(r, 150));
    const encoder = new TextEncoder();
    await queueBLEWrite(encoder.encode(c));
  }catch(e){
    console.error("Mode command:", e);
  }
}

async function enterSMode(){
  if(!targetDataCharacteristic){
    alert("Please connect to Bluetooth HM-10 first!");
    return;
  }

  scriptPlaybackRunning = false;
  scriptPlaybackToken++;
  webCubeMode = "S";
  updateSModeUI();

  const log = document.getElementById("connectionLog");

  try{
    await bleWriteQueue.catch(() => {});
    const packet = new Uint8Array([0xFF, 0x53, 0x00]);
    await queueBLEWrite(packet);

    if(targetDataCharacteristic && webCubeMode === "S"){
      log.innerText = "CONNECTED (S MODE / LAYER STREAM)";
      log.style.color = "#8b5cf6";
    }
  }catch(e){
    webCubeMode = "NONE";
    updateSModeUI();
    log.innerText = "S MODE ENTRY FAILED";
    log.style.color = "var(--danger)";
    alert("S-Mode entry failed: " + e.message);
  }
}

async function sendSingleScriptFrame(frameBytes, token){
  if(!(frameBytes instanceof Uint8Array) || frameBytes.length !== 64){
    throw new Error("S frame must contain exactly 64 bytes");
  }

  for(let layer = 0; layer < 8; layer++){
    if(!scriptPlaybackRunning || token !== scriptPlaybackToken || webCubeMode !== "S") return false;
    
    const layerData = frameBytes.slice(layer * 8, (layer + 1) * 8);
    const packet = new Uint8Array(10);
    packet[0] = 0xFF;
    packet[1] = layer;
    packet.set(layerData, 2);

    await queueBLEWrite(packet, token);
    await new Promise(r => setTimeout(r, 2));
  }
  return true;
}

async function executeSModeTransferEngine(){
  if(!targetDataCharacteristic){
    alert("Please connect to Bluetooth HM-10 first!");
    return;
  }

  if(webCubeMode !== "S"){
    alert("Enter S MODE first.");
    return;
  }

  scriptPlaybackRunning = false;
  scriptPlaybackToken++;
  const token = scriptPlaybackToken;

  await bleWriteQueue.catch(() => {});
  if(token !== scriptPlaybackToken || webCubeMode !== "S") return;

  if(!parseAndCompileScript()){
    alert("No valid frames found.");
    return;
  }

  scriptPlaybackRunning = true;
  const log = document.getElementById("connectionLog");
  log.innerText = "STREAMING " + scriptFrames.length + " LAYER FRAMES...";
  log.style.color = "#8b5cf6";

  try{
    while(scriptPlaybackRunning && token === scriptPlaybackToken && webCubeMode === "S"){
      for(const frame of scriptFrames){
        if(!scriptPlaybackRunning || token !== scriptPlaybackToken || webCubeMode !== "S") break;
        drawPreview(frame.bytes);
        const ok = await sendSingleScriptFrame(frame.bytes, token);
        if(!ok) break;
        await new Promise(r => setTimeout(r, frame.delay));
      }
    }
  }catch(e){
    scriptPlaybackRunning = false;
    log.innerText = "TRANSMISSION ERROR";
    log.style.color = "var(--danger)";
    console.error("S-Mode:", e);
    return;
  }

  if(targetDataCharacteristic && webCubeMode === "S" && token === scriptPlaybackToken){
    log.innerText = "CONNECTED (S MODE)";
  }
}
</script>
</body>
</html>
