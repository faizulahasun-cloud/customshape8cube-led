<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8x8x8 LED Cube Console - Custom Function Studio</title>
<style>
:root{--bg-color:#0b0f19;--panel-bg:#151f32;--text-color:#f1f5f9;--text-muted:#94a3b8;--primary:#2563eb;--primary-hover:#1d4ed8;--success:#10b981;--success-hover:#059669;--warning:#f59e0b;--warning-hover:#d97706;--danger:#ef4444;--danger-hover:#dc2626;--border:#334155}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{background:var(--bg-color);color:var(--text-color);padding:20px;display:flex;justify-content:center;align-items:center;min-height:100vh}
.console-container{background:var(--panel-bg);border:1px solid var(--border);border-radius:12px;width:100%;max-width:650px;padding:24px;box-shadow:0 10px 25px -5px rgba(0,0,0,.3)}
h2{font-size:1.5rem;letter-spacing:1px;text-align:center;margin-bottom:20px;color:#fff;border-bottom:2px solid var(--border);padding-bottom:12px}
h3{font-size:1rem;color:var(--text-muted);margin-top:24px;margin-bottom:12px;letter-spacing:.5px}.status-panel{background:rgba(0,0,0,.2);border:1px solid var(--border);padding:12px;border-radius:6px;font-family:monospace;font-size:.9rem;text-align:center;margin-bottom:20px;color:var(--warning)}.status-disconnected{color:var(--danger)}.status-connected{color:var(--success)}
.btn{display:block;width:100%;padding:12px;margin-bottom:12px;border:none;border-radius:6px;font-size:1rem;font-weight:600;cursor:pointer;transition:background-color .2s,opacity .2s;text-align:center;text-transform:uppercase}.btn:disabled{opacity:.4;cursor:not-allowed}.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover:not(:disabled){background:var(--primary-hover)}.btn-success{background:var(--success);color:#fff}.btn-success:hover:not(:disabled){background:var(--success-hover)}.btn-warning{background:var(--warning);color:#fff}.btn-warning:hover:not(:disabled){background:var(--warning-hover)}.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover:not(:disabled){background:var(--danger-hover)}
.control-group{display:grid;grid-template-columns:1fr 1fr;gap:12px}.engine-panel{border-top:1px dashed var(--border);margin-top:20px;padding-top:10px}textarea{width:100%;height:180px;background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:6px;color:#51ff00;font-family:monospace;padding:10px;resize:vertical;margin-bottom:12px;font-size:.85rem}.range-container{margin-top:16px;background:rgba(0,0,0,.1);padding:12px;border-radius:6px;border:1px solid var(--border)}.range-label{display:flex;justify-content:space-between;font-size:.9rem;color:var(--text-muted);margin-bottom:6px}input[type=range]{width:100%;accent-color:var(--primary)}
</style>
</head>
<body><div class="console-container">
<h2>8x8x8 LED CUBE CONSOLE</h2><div class="status-panel" id="connectionLog">INTERFACE STATUS: DISCONNECTED</div>
<button id="connectBtn" class="btn btn-primary" onclick="triggerBLELinkSession()">Pair HM-10 BLE Module</button><button id="disconnectBtn" class="btn btn-danger" onclick="terminateConnectionSequence()" style="display:none;margin-bottom:12px;">Disconnect Session</button>
<div class="control-group"><button class="btn btn-success modeControl" onclick="transmitModeToken('A')" disabled>Auto Mode ('A')</button><button class="btn btn-warning modeControl" onclick="transmitModeToken('M')" disabled>Manual Mode ('M')</button></div>
<div class="control-group"><button class="btn btn-primary modeControl" style="background:#ffd600;color:#121212;" onclick="transmitModeToken('N')" disabled>Next Animation ('N')</button></div>
<div class="engine-panel"><h3>CUSTOM FUNCTION ENGINE f(x,y,z,f)</h3><textarea id="customFuncIDE" placeholder="Enter custom function here..."></textarea><div class="control-group"><button id="compileCustomBtn" class="btn btn-warning" onclick="compileCustomFunction()">Compile Custom</button><button class="btn btn-success bleControl" id="uploadCustomBtn" onclick="uploadAndStartCustomFunction()" disabled>Upload &amp; Start</button></div><button class="btn btn-danger" id="stopCustomBtn" onclick="stopCustomFunction()" disabled>Stop Custom</button></div>
<div class="range-container"><div class="range-label"><span>BRIGHTNESS CONTROL:</span><span id="sliderValLabel">5</span></div><input type="range" id="brightnessInputSlider" min="2" max="8" value="5" step="1" oninput="executeBrightnessShift(this.value)" disabled></div>
</div>
<script>
let physicalTargetDevice=null,targetDataCharacteristic=null;const HM10_SERVICE_UUID="0000ffe0-0000-1000-8000-00805f9b34fb",HM10_CHAR_UUID="0000ffe1-0000-1000-8000-00805f9b34fb";let bleWriteQueue=Promise.resolve(),brightnessWriteQueue=Promise.resolve(),webCubeMode="NONE",customReady=false,bleRxText="",commandBusy=false,localCompileOk=false,compiledCustomSource="",pendingAckResolvers=[];
function setControlsEnabled(enabled){document.querySelectorAll(".modeControl").forEach(b=>b.disabled=!enabled);document.querySelectorAll(".bleControl").forEach(b=>b.disabled=!enabled);document.getElementById("brightnessInputSlider").disabled=!enabled;}
function waitForAck(expected,timeout=3000){return new Promise((resolve,reject)=>{const item={expected,resolve,reject,timer:null};item.timer=setTimeout(()=>{pendingAckResolvers=pendingAckResolvers.filter(v=>v!==item);reject(new Error("Timed out waiting for "+expected));},timeout);pendingAckResolvers.push(item);});}
function resolveAck(msg){for(let i=0;i<pendingAckResolvers.length;i++){const item=pendingAckResolvers[i];if(item.expected===msg){pendingAckResolvers.splice(i,1);clearTimeout(item.timer);item.resolve(msg);return true;}}return false;}
function rejectPendingAcks(reason){const pending=pendingAckResolvers.splice(0);for(const item of pending){clearTimeout(item.timer);item.reject(new Error(reason));}}
window.addEventListener("DOMContentLoaded",()=>{setControlsEnabled(false);document.getElementById("compileCustomBtn").disabled=false;document.getElementById("customFuncIDE").addEventListener("input",()=>{localCompileOk=false;compiledCustomSource="";document.getElementById("uploadCustomBtn").disabled=true;});});
function validateCustomExpression(expr,allowedNames){const original=expr.trim();if(!original||!/^[A-Za-z0-9_+*/%<>=!&|().\s-]+$/.test(original))return false;const originalIds=original.match(/[A-Za-z_][A-Za-z0-9_]*/g)||[];const builtins=new Set(["X","Y","Z","F","T","SIN","COS","SQRT","ABS"]);for(const id of originalIds){const u=id.toUpperCase();if(!builtins.has(u)&&!allowedNames.has(u))return false;}let s=original;s=s.replace(/\b(sin|cos|sqrt|abs)\s*\(/gi,(m,fn)=>({sin:"Math.sin(",cos:"Math.cos(",sqrt:"Math.sqrt(",abs:"Math.abs("})[fn.toLowerCase()]));s=s.replace(/\bOR\b/gi,"||");try{new Function("X","Y","Z","F","T","Math","return ("+s+");");return true;}catch(_){return false;}}
function localCompileCustomSource(source){const lines=source.split(/\r?\n/).map(v=>v.trim()).filter(Boolean);if(lines.length<2||lines[0].toUpperCase()!=="CUSTOM"||lines[lines.length-1].toUpperCase()!=="END")return {ok:false,error:"CUSTOM function must start with CUSTOM and end with END."};const body=lines.slice(1,-1),names=new Set();let geometry=false;for(const line of body){const eq=line.indexOf("=");if(eq>0){const lhs=line.slice(0,eq).trim();if(/^[A-Za-z_][A-Za-z0-9_]*$/.test(lhs))names.add(lhs.toUpperCase());}}for(const line of body){const upper=line.toUpperCase();if(upper.startsWith("IF ")){let c=line.slice(3).trim();if(/\s+OFF$/i.test(c))c=c.replace(/\s+OFF$/i,"").trim();else if(/\s+ON$/i.test(c))c=c.replace(/\s+ON$/i,"").trim();if(!validateCustomExpression(c,names))return {ok:false,error:"Invalid IF expression: "+line};geometry=true;continue;}if(upper.startsWith("ON IF ")){if(!validateCustomExpression(line.slice(6).trim(),names))return {ok:false,error:"Invalid ON IF expression: "+line};geometry=true;continue;}if(upper.startsWith("OFF IF ")){if(!validateCustomExpression(line.slice(7).trim(),names))return {ok:false,error:"Invalid OFF IF expression: "+line};geometry=true;continue;}if(/^(RETURN|SHOW|VOXEL)\s+/i.test(line)){const expr=line.replace(/^(RETURN|SHOW|VOXEL)\s+/i,"");if(!validateCustomExpression(expr,names))return {ok:false,error:"Invalid geometry expression: "+line};geometry=true;continue;}const eq2=line.indexOf("=");if(eq2>0){const lhs=line.slice(0,eq2).trim(),rhs=line.slice(eq2+1).trim();if(!/^[A-Za-z_][A-Za-z0-9_]*$/.test(lhs)||!rhs)return {ok:false,error:"Invalid assignment: "+line};if(lhs.toUpperCase()==="Z"&&/\s+OR\s+/i.test(rhs)){for(const part of rhs.split(/\s+OR\s+/i)){const p=part.replace(/^Z\s*=\s*/i,"").trim();if(!validateCustomExpression(p,names))return {ok:false,error:"Invalid Z expression: "+line};}}else if(!validateCustomExpression(rhs,names))return {ok:false,error:"Invalid expression: "+line};if(lhs.toUpperCase()==="Z")geometry=true;continue;}return {ok:false,error:"Unsupported statement: "+line};}return geometry?{ok:true}:{ok:false,error:"No voxel geometry was defined."};}
async function queueBLEWrite(data){bleWriteQueue=bleWriteQueue.catch(()=>{}).then(async()=>{if(!targetDataCharacteristic||!physicalTargetDevice?.gatt?.connected)throw new Error("Bluetooth disconnected.");let lastError=null;for(let attempts=0;attempts<5;attempts++){try{if(typeof targetDataCharacteristic.writeValueWithoutResponse==="function")await targetDataCharacteristic.writeValueWithoutResponse(data);else await targetDataCharacteristic.writeValue(data);return;}catch(e){lastError=e;const msg=(e&&e.message||"").toLowerCase();if(!msg.includes("already in progress")&&!msg.includes("operation in progress"))throw e;await new Promise(r=>setTimeout(r,120));}}throw lastError||new Error("BLE GATT write failed.");});return bleWriteQueue;}
async function transmitModeToken(token){if(!targetDataCharacteristic||!physicalTargetDevice?.gatt?.connected){alert("Bluetooth is not connected.");return;}if(commandBusy)return;commandBusy=true;const expected=token==="A"?"MODE_AUTO":token==="M"?"MODE_MANUAL":"ANIMATION_NEXT";try{const ack=waitForAck(expected);await queueBLEWrite(new TextEncoder().encode(token));await ack;const log=document.getElementById("connectionLog");log.innerText=expected.replace(/_/g," ");log.className="status-panel status-connected";}catch(e){const log=document.getElementById("connectionLog");log.innerText="COMMAND ERROR: "+e.message;log.className="status-panel status-disconnected";}finally{commandBusy=false;}}
async function triggerBLELinkSession(){const log=document.getElementById("connectionLog");log.innerText="SEARCHING...";setControlsEnabled(false);try{physicalTargetDevice=await navigator.bluetooth.requestDevice({filters:[{services:[HM10_SERVICE_UUID]}],optionalServices:[HM10_SERVICE_UUID]});log.innerText="CONNECTING TO GATT LAYER...";const server=await physicalTargetDevice.gatt.connect(),service=await server.getPrimaryService(HM10_SERVICE_UUID);targetDataCharacteristic=await service.getCharacteristic(HM10_CHAR_UUID);await targetDataCharacteristic.startNotifications();targetDataCharacteristic.addEventListener('characteristicvaluechanged',onDataNotificationsReceived);physicalTargetDevice.addEventListener('gattserverdisconnected',cleanSessionStateWipe);bleRxText="";webCubeMode="NONE";customReady=false;localCompileOk=false;compiledCustomSource="";document.getElementById("uploadCustomBtn").disabled=true;document.getElementById("stopCustomBtn").disabled=true;log.innerText="CONNECTED — WAITING 3.5 SECONDS BEFORE HANDSHAKE";log.className="status-panel status-connected";document.getElementById('connectBtn').style.display="none";document.getElementById('disconnectBtn').style.display="block";await new Promise(r=>setTimeout(r,3500));if(!targetDataCharacteristic||!physicalTargetDevice?.gatt?.connected)throw new Error("Bluetooth disconnected during startup wait.");const ack=waitForAck("HANDSHAKE_OK",3000);await queueBLEWrite(new TextEncoder().encode("H"));await ack;setControlsEnabled(true);document.getElementById("compileCustomBtn").disabled=false;document.getElementById("uploadCustomBtn").disabled=!localCompileOk;log.innerText="INTERFACE STATUS: READY — HANDSHAKE OK";log.className="status-panel status-connected";}catch(e){rejectPendingAcks("Bluetooth session ended");targetDataCharacteristic=null;webCubeMode="NONE";log.innerText="CONNECTION FAILED: "+e.message;log.className="status-panel status-disconnected";setControlsEnabled(false);document.getElementById("compileCustomBtn").disabled=false;try{if(physicalTargetDevice&&physicalTargetDevice.gatt.connected)physicalTargetDevice.gatt.disconnect();}catch(_){} }}
function onDataNotificationsReceived(event){bleRxText+=new TextDecoder('utf-8').decode(event.target.value);let parts=bleRxText.split("\n");bleRxText=parts.pop();for(const raw of parts){const cleanData=raw.replace(/\r/g,"").trim();if(!cleanData)continue;resolveAck(cleanData);const log=document.getElementById("connectionLog");if(cleanData==="HANDSHAKE_OK"){log.innerText="HANDSHAKE OK";log.className="status-panel status-connected";}else if(cleanData==="MODE_AUTO"){webCubeMode="A";log.innerText="AUTO MODE ACTIVE";log.className="status-panel status-connected";}else if(cleanData==="MODE_MANUAL"){webCubeMode="M";log.innerText="MANUAL MODE ACTIVE";log.className="status-panel status-connected";}else if(cleanData==="ANIMATION_NEXT"){log.innerText="NEXT ANIMATION ACTIVE";log.className="status-panel status-connected";}else if(cleanData==="CUSTOM_UPLOAD_READY"){webCubeMode="NONE";customReady=false;document.getElementById("uploadCustomBtn").disabled=true;document.getElementById("stopCustomBtn").disabled=true;log.innerText="CUSTOM WAITING — CUBE BLANK";log.className="status-panel status-connected";}else if(cleanData==="CUSTOM_OK"){customReady=true;log.innerText="CUSTOM FUNCTION ACCEPTED";log.className="status-panel status-connected";}else if(cleanData==="CUSTOM_ERROR"){customReady=false;webCubeMode="NONE";document.getElementById("uploadCustomBtn").disabled=true;document.getElementById("stopCustomBtn").disabled=true;log.innerText="CUSTOM FUNCTION REJECTED — CUBE REMAINS BLANK";log.className="status-panel status-disconnected";}else if(cleanData==="CUSTOM_STARTED"){customReady=true;webCubeMode="CUSTOM";document.getElementById("stopCustomBtn").disabled=false;log.innerText="CUSTOM MODE ACTIVE";log.className="status-panel status-connected";}else if(cleanData==="CUSTOM_STOPPED"){webCubeMode="A";customReady=false;document.getElementById("stopCustomBtn").disabled=true;log.innerText="CUSTOM MODE STOPPED — AUTO MODE ACTIVE";log.className="status-panel status-connected";}else if(cleanData==="CUSTOM_NOT_ACTIVE"){log.innerText="CUSTOM MODE NOT ACTIVE";log.className="status-panel status-connected";}else if(cleanData==="CUSTOM_NOT_READY"){customReady=false;webCubeMode="NONE";document.getElementById("uploadCustomBtn").disabled=true;document.getElementById("stopCustomBtn").disabled=true;log.innerText="CUSTOM FUNCTION NOT READY";log.className="status-panel status-disconnected";}else if(cleanData==="MATH_UPLOAD_READY"){log.innerText="MATH WAITING FOR PROGRAM";log.className="status-panel status-connected";}else if(cleanData==="MATH_OK"){log.innerText="MATH PROGRAM ACCEPTED";log.className="status-panel status-connected";}else if(cleanData==="MATH_STARTED"){webCubeMode="MATH";log.innerText="MATH MODE ACTIVE";log.className="status-panel status-connected";}else if(cleanData==="MATH_ERROR"){log.innerText="MATH PROGRAM REJECTED";log.className="status-panel status-disconnected";}else if(cleanData==="BRIGHTNESS_OK"){log.innerText="BRIGHTNESS UPDATED";log.className="status-panel status-connected";}else if(cleanData==="BRIGHTNESS_ERROR"){log.innerText="BRIGHTNESS ERROR";log.className="status-panel status-disconnected";}}}
function cleanSessionStateWipe(){rejectPendingAcks("Bluetooth disconnected");bleRxText="";targetDataCharacteristic=null;physicalTargetDevice=null;webCubeMode="NONE";customReady=false;localCompileOk=false;compiledCustomSource="";document.getElementById('uploadCustomBtn').disabled=true;document.getElementById('stopCustomBtn').disabled=true;setControlsEnabled(false);document.getElementById("compileCustomBtn").disabled=false;const log=document.getElementById('connectionLog');log.innerText="DISCONNECTED";log.className="status-panel status-disconnected";document.getElementById('connectBtn').style.display="block";document.getElementById('disconnectBtn').style.display="none";}
async function terminateConnectionSequence(){if(physicalTargetDevice&&physicalTargetDevice.gatt.connected){try{physicalTargetDevice.gatt.disconnect();}catch(e){}}cleanSessionStateWipe();}
function executeBrightnessShift(val){document.getElementById("sliderValLabel").innerText=val;brightnessWriteQueue=brightnessWriteQueue.catch(()=>{}).then(async()=>{if(!targetDataCharacteristic)return;const ack=waitForAck("BRIGHTNESS_OK",3000);await queueBLEWrite(new Uint8Array([0x42,parseInt(val,10)]));await ack;}).catch(e=>console.error("Brightness update failed:",e));return brightnessWriteQueue;}
async function compileCustomFunction(){if(commandBusy)return;const code=document.getElementById("customFuncIDE").value.trim();if(!code){alert("Custom function is empty.");return;}const result=localCompileCustomSource(code);const log=document.getElementById("connectionLog");if(!result.ok){localCompileOk=false;compiledCustomSource="";document.getElementById("uploadCustomBtn").disabled=true;log.innerText="CUSTOM COMPILE FAILED — NOTHING SENT TO ARDUINO";log.className="status-panel status-disconnected";alert(result.error);return;}localCompileOk=true;compiledCustomSource=code;document.getElementById("uploadCustomBtn").disabled=!(targetDataCharacteristic&&physicalTargetDevice?.gatt?.connected);log.innerText=targetDataCharacteristic&&physicalTargetDevice?.gatt?.connected?"CUSTOM COMPILE OK — READY TO UPLOAD":"CUSTOM COMPILE OK — CONNECT TO UPLOAD";log.className="status-panel status-connected";}
async function uploadAndStartCustomFunction(){if(!targetDataCharacteristic||!physicalTargetDevice?.gatt?.connected){alert("Bluetooth is not connected.");return;}if(!localCompileOk||document.getElementById("customFuncIDE").value.trim()!==compiledCustomSource){alert("Compile the current Custom function successfully before uploading.");return;}if(commandBusy)return;commandBusy=true;const log=document.getElementById("connectionLog");customReady=false;webCubeMode="NONE";document.getElementById("uploadCustomBtn").disabled=true;document.getElementById("stopCustomBtn").disabled=true;log.innerText="REQUESTING CUSTOM UPLOAD";log.className="status-panel";try{const enc=new TextEncoder();const ready=waitForAck("CUSTOM_UPLOAD_READY",3000);await queueBLEWrite(enc.encode("C"));await ready;const payload=compiledCustomSource+"\nCF_END\n";const accepted=waitForAck("CUSTOM_OK",5000);for(let i=0;i<payload.length;i+=20){await queueBLEWrite(enc.encode(payload.slice(i,i+20)));await new Promise(r=>setTimeout(r,20));}await accepted;const started=waitForAck("CUSTOM_STARTED",3000);await queueBLEWrite(enc.encode("X"));await started;customReady=true;webCubeMode="CUSTOM";document.getElementById("stopCustomBtn").disabled=false;log.innerText="CUSTOM MODE ACTIVE";log.className="status-panel status-connected";}catch(e){customReady=false;webCubeMode="NONE";document.getElementById("uploadCustomBtn").disabled=!localCompileOk;document.getElementById("stopCustomBtn").disabled=true;log.innerText="CUSTOM UPLOAD ERROR — CUBE REMAINS BLANK";log.className="status-panel status-disconnected";console.error(e);}finally{commandBusy=false;}}
async function stopCustomFunction(){if(!targetDataCharacteristic||commandBusy)return;commandBusy=true;try{const ack=waitForAck("CUSTOM_STOPPED",3000);await queueBLEWrite(new TextEncoder().encode("S"));await ack;webCubeMode="A";customReady=false;document.getElementById("stopCustomBtn").disabled=true;document.getElementById("connectionLog").innerText="CUSTOM STOPPED — AUTO MODE ACTIVE";}catch(e){const log=document.getElementById("connectionLog");log.innerText="CUSTOM STOP ERROR: "+e.message;log.className="status-panel status-disconnected";console.error(e);}finally{commandBusy=false;}}
</script></body></html>
