<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8x8x8 LED Cube Console - Script Engine</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #151f32;
            --text-color: #f1f5f9;
            --text-muted: #94a3b8;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --success-hover: #059669;
            --warning: #f59e0b;
            --warning-hover: #d97706;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .console-container {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 100%;
            max-width: 600px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        h2 {
            font-size: 1.5rem;
            letter-spacing: 1px;
            text-align: center;
            margin-bottom: 20px;
            color: #fff;
            border-bottom: 2px solid var(--border);
            padding-bottom: 12px;
        }

        h3 {
            font-size: 1rem;
            color: var(--text-muted);
            margin-top: 24px;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .status-panel {
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 20px;
            color: var(--warning);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
        }

        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }

        .btn-success { background-color: var(--success); color: white; }
        .btn-success:hover { background-color: var(--success-hover); }

        .btn-warning { background-color: var(--warning); color: white; }
        .btn-warning:hover { background-color: var(--warning-hover); }

        .btn-danger { background-color: var(--danger); color: white; }
        .btn-danger:hover { background-color: var(--danger-hover); }

        .btn-s-mode {
            background-color: #8b5cf6;
            color: white;
            margin-top: 10px;
        }
        .btn-s-mode:hover {
            background-color: #7c3aed;
        }

        .control-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .engine-panel {
            border-top: 1px dashed var(--border);
            margin-top: 20px;
            padding-top: 10px;
        }

        textarea {
            width: 100%;
            height: 150px;
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: #51ff00;
            font-family: monospace;
            padding: 10px;
            resize: vertical;
            margin-bottom: 12px;
            font-size: 0.85rem;
        }

        .file-input-wrapper {
            margin-bottom: 12px;
        }

        input[type="file"] {
            display: none;
        }

        .file-label {
            display: block;
            background-color: #334155;
            color: var(--text-color);
            padding: 10px;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            border: 1px solid var(--border);
        }

        .file-label:hover {
            background-color: #475569;
        }

        .range-container {
            margin-top: 16px;
            background-color: rgba(0, 0, 0, 0.1);
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .range-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="console-container">
        <h2>8x8x8 CUBE ADVANCED ENGINE</h2>

        <div class="status-panel" id="connectionLog">
            INTERFACE STATUS: DISCONNECTED
        </div>

        <button class="btn btn-primary" onclick="connectBLE()">
            Pair HM-10 BLE Module
        </button>

        <div class="control-group">
            <button class="btn btn-success" onclick="transmitModeToken('A')">
                Auto Mode ('A')
            </button>
            <button class="btn btn-warning" onclick="transmitModeToken('M')">
                Manual Mode ('M')
            </button>
        </div>

        <button class="btn btn-primary" onclick="transmitModeToken('N')">
            Next Pattern Step ('N')
        </button>

        <div class="engine-panel">
            <h3>CUSTOM .TXT CODE ENGINE (MODE 'S')</h3>
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 10px;">
                Upload a .txt script file or write XYZ code. Script automatically saves to local browser storage.
            </p>

            <div class="file-input-wrapper">
                <label class="file-label" for="txtFileInput" id="fileInputLabel">
                    Choose Script File (.txt)
                </label>
                <input type="file" id="txtFileInput" accept=".txt" onchange="handleFileLoad(event)">
            </div>

            <textarea id="scriptIDE" placeholder="// Enter layer hex codes or commands here...&#10;// Example:&#10;// B10000001... (64 hex characters)"></textarea>

            <div class="control-group">
                <button class="btn btn-primary" style="background-color: #475569;" onclick="saveToStorage()">
                    Save Script to Storage
                </button>
                <button class="btn btn-primary" style="background-color: #475569;" onclick="parseAndCompileScript()">
                    Compile Code Engine
                </button>
            </div>

            <button class="btn btn-s-mode" onclick="executeSModeTransferEngine()">
                DRAW / RUN CUSTOM SCRIPT
            </button>
        </div>

        <div class="range-container">
            <div class="range-label">
                <span>BRIGHTNESS CONTROL:</span>
                <span id="brightnessVal">5</span>
            </div>
            <input type="range" id="brightnessRange" min="1" max="10" value="5" oninput="updateBrightness(this.value)">
        </div>

        <button class="btn btn-danger" style="margin-top: 20px; margin-bottom: 0;" onclick="disconnectBLE()">
            Disconnect Session
        </button>
    </div>

    <script>
        // Web BLE profile handles
        let targetDevice = null;
        let targetDataCharacteristic = null;

        // Custom S-Mode engine targets
        const HM10_SERVICE_UUID = "0000ffe0-0000-1000-8000-00805f9b34fb";
        const HM10_CHARACTERISTIC_UUID = "0000ffe1-0000-1000-8000-00805f9b34fb";

        // Runtime states & concurrency hooks
        let scriptFrames = [];
        let scriptPlaybackRunning = false;
        let scriptPlaybackToken = 0;
        let bleWriteQueue = Promise.resolve();

        // Safe-load text buffer cache
        window.addEventListener('DOMContentLoaded', () => {
            const cachedScript = localStorage.getItem('cube_cached_script');
            if (cachedScript) {
                document.getElementById('scriptIDE').value = cachedScript;
            }
        });

        function saveToStorage() {
            const currentCode = document.getElementById('scriptIDE').value;
            localStorage.setItem('cube_cached_script', currentCode);
            alert("Script compiled and committed to browser sandbox.");
        }

        function handleFileLoad(event) {
            const input = event.target;
            if (!input.files || input.files.length === 0) return;
            
            const file = input.files[0];
            document.getElementById('fileInputLabel').innerText = file.name;
            
            const reader = new FileReader();
            reader.onload = function() {
                document.getElementById('scriptIDE').value = reader.result;
                localStorage.setItem('cube_cached_script', reader.result);
            };
            reader.readAsText(file);
        }

        // Simplistic parser looking for 64-byte frame patterns
        function parseAndCompileScript() {
            scriptFrames = [];
            const rawText = document.getElementById('scriptIDE').value;
            const lines = rawText.split('\n');

            for (let line of lines) {
                line = line.trim();
                // Strip comments
                if (line.startsWith('//') || line.startsWith('#')) continue;

                // Clean input line of non-hex if formatting is used
                const hexClean = line.replace(/[^0-9a-fA-F]/g, '');
                
                // Check if frame has correct data depth (64 bytes = 128 hex chars, or raw binary conversions)
                if (hexClean.length >= 128) {
                    let frameBytes = new Uint8Array(64);
                    for (let i = 0; i < 64; i++) {
                        frameBytes[i] = parseInt(hexClean.substr(i * 2, 2), 16) || 0;
                    }
                    scriptFrames.push(frameBytes);
                } else if (line.length >= 64) {
                    // Try parsing as raw individual characters/states
                    let frameBytes = new Uint8Array(64);
                    for(let i = 0; i < 64; i++) {
                        frameBytes[i] = line.charCodeAt(i) || 0;
                    }
                    scriptFrames.push(frameBytes);
                }
            }
            console.log("Compiled frames: ", scriptFrames.length);
        }

        async function connectBLE() {
            const logDisplay = document.getElementById('connectionLog');
            logDisplay.innerText = "REQUESTING BLE DEVICE...";
            logDisplay.style.color = "var(--warning)";
            try {
                targetDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [HM10_SERVICE_UUID] }],
                    optionalServices: [HM10_SERVICE_UUID]
                });
                logDisplay.innerText = "CONNECTING TO GATT LAYER...";
                const server = await targetDevice.gatt.connect();
                logDisplay.innerText = "PARSING HM-10 SERVICE...";
                const service = await server.getPrimaryService(HM10_SERVICE_UUID);
                logDisplay.innerText = "ACQUIRING RX/TX CHARACTERISTIC...";
                targetDataCharacteristic = await service.getCharacteristic(HM10_CHARACTERISTIC_UUID);
                logDisplay.innerText = "INTERFACE STATUS: CONNECTED";
                logDisplay.style.color = "var(--success)";
                targetDevice.addEventListener('gattserverdisconnected', onDisconnected);
            } catch (error) {
                console.error(error);
                logDisplay.innerText = "CONNECTION FAILED";
                logDisplay.style.color = "var(--danger)";
                alert("BLE Handshake failed: " + error.message);
            }
        }

        function onDisconnected() {
            const logDisplay = document.getElementById('connectionLog');
            logDisplay.innerText = "INTERFACE STATUS: DISCONNECTED";
            logDisplay.style.color = "var(--warning)";
            targetDataCharacteristic = null;
            scriptPlaybackRunning = false;
        }

        function disconnectBLE() {
            if (targetDevice && targetDevice.gatt.connected) {
                targetDevice.gatt.disconnect();
            }
        }

        async function updateBrightness(val) {
            document.getElementById('brightnessVal').innerText = val;
            const brightnessToken = String(val === "10" ? "9" : val);
            await transmitModeToken(brightnessToken);
        }

        async function transmitModeToken(tokenChar) {
            if (!targetDataCharacteristic) return;
            
            // Stop custom S-mode animation when changing to A/M/N/Q
            if (tokenChar === 'A' || tokenChar === 'M' || tokenChar === 'N' || tokenChar === 'Q') {
                scriptPlaybackRunning = false;
                scriptPlaybackToken++;
            }
            
            const buffer = new TextEncoder().encode(tokenChar);
            bleWriteQueue = bleWriteQueue.then(async () => {
                if (!targetDataCharacteristic) return;
                await targetDataCharacteristic.writeValueWithoutResponse(buffer);
                await new Promise(resolve => setTimeout(resolve, 60));
            });
            return bleWriteQueue;
        }

        // Serialized BLE Write to prevent GATT busy errors
        function queueBLEWrite(data) {
            bleWriteQueue = bleWriteQueue.then(async () => {
                if (!targetDataCharacteristic) {
                    throw new Error("Bluetooth disconnected.");
                }
                let attempts = 0;
                while (attempts < 5) {
                    try {
                        await targetDataCharacteristic.writeValueWithoutResponse(data);
                        await new Promise(resolve => setTimeout(resolve, 70));
                        return;
                    } catch (error) {
                        attempts++;
                        if (!error.message || !error.message.toLowerCase().includes("already in progress")) {
                            throw error;
                        }
                        await new Promise(resolve => setTimeout(resolve, 150));
                    }
                }
                throw new Error("BLE GATT remained busy after multiple retries.");
            });
            return bleWriteQueue;
        }

        // Send one 64-byte frame
        async function sendSingleScriptFrame(frameBytes) {
            let packet = new Uint8Array(66);
            packet[0] = 0xFF;
            packet[1] = 83; // ASCII S
            packet.set(frameBytes, 2);
            
            const CHUNK_SIZE = 20;
            for (let i = 0; i < packet.length; i += CHUNK_SIZE) {
                if (!scriptPlaybackRunning) return;
                const chunk = packet.slice(i, Math.min(i + CHUNK_SIZE, packet.length));
                await queueBLEWrite(chunk);
            }
        }

        // Dedicated DRAW / S-Mode Engine
        async function executeSModeTransferEngine() {
            if (!targetDataCharacteristic) {
                alert("Please connect to Bluetooth HM-10 first!");
                return;
            }
            
            scriptPlaybackRunning = false;
            scriptPlaybackToken++;
            const myToken = scriptPlaybackToken;
            
            await bleWriteQueue;
            parseAndCompileScript();
            
            if (scriptFrames.length === 0) {
                alert("No valid frames found.");
                return;
            }
            
            scriptPlaybackRunning = true;
            const statusDisplay = document.getElementById('connectionLog');
            statusDisplay.innerText = "DRAWING " + scriptFrames.length + " FRAME(S)...";
            
            try {
                while (scriptPlaybackRunning && myToken === scriptPlaybackToken) {
                    for (let frameIndex = 0; frameIndex < scriptFrames.length; frameIndex++) {
                        if (!scriptPlaybackRunning || myToken !== scriptPlaybackToken) break;
                        
                        await sendSingleScriptFrame(scriptFrames[frameIndex]);
                        
                        if (!scriptPlaybackRunning || myToken !== scriptPlaybackToken) break;
                        
                        await new Promise(resolve => setTimeout(resolve, 250));
                    }
                }
            } catch (error) {
                scriptPlaybackRunning = false;
                statusDisplay.innerText = "TRANSMISSION ERROR";
                alert("S-Mode transmission failed: " + error.message);
                return;
            }
            
            if (targetDataCharacteristic) {
                statusDisplay.innerText = "CONNECTED (DRAW MODE)";
            }
        }
    </script>
</body>
</html>
